<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Três Ursos na Cidade</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI',Arial,sans-serif;
    background:#0b1f3a; color:#fff;
    min-height:100vh; overflow:hidden;
  }
  header {
    text-align:center; padding:10px; background:#12284a; border-bottom:2px solid #2b5a8c;
  }
  header h1 { font-size:1.3rem; }
  header p { font-size:.85rem; opacity:.8; }
  #wrap { position:relative; display:flex; justify-content:center; }
  #canvas { display:block; background:#3a6ea5; touch-action:none; max-width:100vw; max-height:calc(100vh - 130px); width:auto; height:auto; }
  #hud {
    position:fixed; left:10px; top:10px; background:rgba(0,0,0,.55);
    padding:8px 14px; border-radius:10px; font-size:.9rem; z-index:10;
  }
  #msg {
    position:fixed; left:50%; top:20px; transform:translateX(-50%);
    background:rgba(0,0,0,.75); padding:10px 20px; border-radius:12px;
    font-size:1rem; display:none; z-index:20; text-align:center; max-width:90vw;
  }
  #controls {
    position:fixed; right:10px; top:10px; background:rgba(0,0,0,.55);
    padding:8px 14px; border-radius:10px; font-size:.8rem; z-index:10; line-height:1.5;
  }
  kbd { background:#2b5a8c; padding:1px 6px; border-radius:5px; font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>🐻 Os Três Ursos na Floresta</h1>
  <p>Controle o urso andando pela floresta. Pegue peixes e se esconda nas casas e lojas!</p>
</header>
<div id="wrap">
  <canvas id="canvas"></canvas>
</div>
<div id="hud">🐟 Peixes: <b id="peixes">0</b> &nbsp; ⚠️ Avisos: <b id="avs">3</b> &nbsp; <span id="hideState"></span> &nbsp; <button id="btnReset">↻ Reiniciar</button></div>
<div id="msg"></div>
<div id="controls">
  <b>Movimento:</b><br>
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / Setas<br>
  Correr: <kbd>Shift</kbd><br>
  Esconder: entre nas casas 🏠 e lojas 🏪<br>
  <small>Móvel: arraste/toque na tela</small><br>
  <small>R = reiniciar</small>
</div>

<script>
const cv = document.getElementById("canvas");
const ctx = cv.getContext("2d");
const MSG = document.getElementById("msg");
const PEIXES = document.getElementById("peixes");
const AVS = document.getElementById("avs");
const HIDESTATE = document.getElementById("hideState");
document.getElementById("btnReset").addEventListener("click",()=>reset());

const T = 48; // tile size (tela maior)
const cols = 36, rows = 24;
cv.width = cols*T; cv.height = rows*T;

// tile map: .=grama,1=árvore,2=pedra,3=lago,4=trilha,H=parede,C=casa,L=loja (36 cols)
const map = [
"111111111111111111111111111111111111",
"1..............1..41...1...........1",
"1.HHHHHHH.....11..4........HHHHHHH.1",
"1.HCCCCCH....1..1.4.1......HLLLLLH.1",
"1.HCCCCCH..11.....4........HLLLLLH.1",
"1.HCCCCCH...1.....41.1..11.HLLLLLH.1",
"1.HHH..HH.........4........HHH..HH.1",
"1................14...2............1",
"144444444444444444444444444444444441",
"1.....1.....1.....4...1............1",
"1........1...333..4..........1.....1",
"1..........133333.4..1......1...11.1",
"1......1...13333314....1......1.1.11",
"1.......2....3331.4.......1..1.....1",
"1.....1...1.......4..............1.1",
"144444444444444444444444444444444441",
"1............21...4.....1..........1",
"1.HHH..HH....11...4.1......HHH..HH.1",
"1.HCCCCCH......1..4.1......HLLLLLH.1",
"1.HCCCCCH.........4........HLLLLLH.1",
"1.HCCCCCH..1..11..4...111..HLLLLLH.1",
"1.HHHHHHH.........4.1..2...HHHHHHH.1",
"1..............1..4....1.1.........1",
"111111111111111111111111111111111111"
];

const tiles = {
  '1':{solid:true,color:'#1e4d2b',name:'arvore'},    // árvore densa (bloqueia)
  '2':{solid:true,color:'#5b6b5c',name:'pedra'},     // pedra (bloqueia)
  '3':{solid:true,color:'#2e86c1',name:'lago'},      // lago (bloqueia)
  '4':{solid:false,color:'#8a7a5a',name:'trilha'},   // trilha de terra
  'H':{solid:true,color:'#6e4a2f',name:'parede'},    // parede de casa/loja
  'C':{solid:false,color:'#a98a5a',name:'casa'},     // interior da casa (esconderijo)
  'L':{solid:false,color:'#c9a86a',name:'loja'},     // interior da loja (esconderijo)
  '0':{solid:false,color:'#3f7d3a',name:'grama'},    // grama
  '.':{solid:false,color:'#3f7d3a',name:'grama'}     // grama (alias usado no mapa)
};

// pontos de peixe (todos em tiles pisáveis)
const peixes = [
  {x:3,y:1},{x:20,y:1},{x:10,y:3},{x:24,y:4},{x:8,y:9},
  {x:24,y:10},{x:7,y:13},{x:24,y:13},{x:10,y:19},{x:24,y:21}
];
const esconderijos = [ // casas e lojas: entrar no interior esconde
  {x:4,y:4,name:'Casa do Lago 🏠',tipo:'casa'},
  {x:30,y:4,name:'Loja da Colina 🏪',tipo:'loja'},
  {x:4,y:19,name:'Casa da Clareira 🏠',tipo:'casa'},
  {x:30,y:19,name:'Loja da Floresta 🏪',tipo:'loja'}
];

let player = { x:18*T+T/2, y:22*T+T/2, vx:0, vy:0, dir:0, moving:false, hid:false };
let peixeColetados = 0;
let avisos = 3;
let peixeState = peixes.map(()=>true);
let humanos = [];
let tempo = 0;
let hitCooldown = 0;
let gameOver = false, vitoria = false;

function isSolid(px,py){
  const cx=Math.floor(px/T), cy=Math.floor(py/T);
  if(cx<0||cy<0||cx>=cols||cy>=rows) return true;
  const t=map[cy][cx];
  return tiles[t]?tiles[t].solid:true;
}
function solidAt(cx,cy){
  if(cx<0||cy<0||cx>=cols||cy>=rows) return true;
  const t=map[cy][cx];
  return tiles[t]?tiles[t].solid:true;
}

// humano único (patrulha a trilha principal)
function initHumanos(){
  humanos = [
    {x:18*T,y:8*T,dir:1,ax:4, bx:31, vel:0.7}
  ];
}

const keys={};
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

// controles touch (com correção de escala CSS -> coordenadas do mundo)
let touchActive=false,touchX=0,touchY=0;
function touchToWorld(e){
  const r=cv.getBoundingClientRect();
  const sx=cv.width/r.width, sy=cv.height/r.height;
  return { x:(e.touches[0].clientX-r.left)*sx, y:(e.touches[0].clientY-r.top)*sy };
}
cv.addEventListener('touchstart',e=>{touchActive=true;const p=touchToWorld(e);touchX=p.x;touchY=p.y;e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{const p=touchToWorld(e);touchX=p.x;touchY=p.y;e.preventDefault();},{passive:false});
cv.addEventListener('touchend',()=>{touchActive=false;});

function tryMove(dx,dy){
  const nx=player.x+dx, ny=player.y+dy;
  const r=9;
  // verificar cantos para colisão
  if(!isSolid(nx-r,ny-r)&&!isSolid(nx+r,ny-r)&&!isSolid(nx-r,ny+r)&&!isSolid(nx+r,ny+r)){
    player.x=nx; player.y=ny; return true;
  }
  // mover apenas em x
  if(!isSolid(nx-r,player.y-r)&&!isSolid(nx+r,player.y-r)&&!isSolid(nx-r,player.y+r)&&!isSolid(nx+r,player.y+r)){
    player.x=nx;
  }
  if(!isSolid(player.x-r,ny-r)&&!isSolid(player.x+r,ny-r)&&!isSolid(player.x-r,ny+r)&&!isSolid(player.x+r,ny+r)){
    player.y=ny;
  }
  return true;
}

function update(dt){
  if(gameOver||vitoria) return;
  // movimento do jogador
  let ix=0, iy=0;
  if(keys['w']||keys['arrowup']) iy=-1;
  if(keys['s']||keys['arrowdown']) iy=1;
  if(keys['a']||keys['arrowleft']) ix=-1;
  if(keys['d']||keys['arrowright']) ix=1;
  if(touchActive){
    const dx=touchX-player.x, dy=touchY-player.y;
    const d=Math.hypot(dx,dy);
    if(d>12){ ix=dx/d; iy=dy/d; }
  }
  const run = keys['shift']?1.8:1;
  const speed = 110*run*dt;
  player.moving=(ix!==0||iy!==0);
  if(ix||iy){
    player.dir = Math.atan2(iy,ix);
    tryMove(ix*speed, iy*speed);
  }

  // esconderijo: dentro de casa (C) ou loja (L) o urso fica escondido
  const pcx=Math.floor(player.x/T), pcy=Math.floor(player.y/T);
  const tileAqui=(map[pcy]&&map[pcy][pcx])||'.';
  const wasHid=player.hid;
  player.hid = (tileAqui==='C'||tileAqui==='L');
  if(player.hid && !wasHid) showMsg('🫣 Escondido dentro do abrigo! O humano não te vê.',1200);
  HIDESTATE.textContent = player.hid ? '🫣 Escondido' : '';
  if(hitCooldown>0) hitCooldown-=dt;

  // coletar peixes
  for(let i=0;i<peixes.length;i++){
    if(peixeState[i]){
      const p=peixes[i];
      const dx=player.x-(p.x*T+T/2), dy=player.y-(p.y*T+T/2);
      if(Math.hypot(dx,dy)<T*0.7){
        peixeState[i]=false; peixeColetados++;
        PEIXES.textContent=peixeColetados;
        showMsg('🐟 Pegou um peixe!',900);
        if(peixeColetados>=peixes.length) vitoria=true;
      }
    }
  }

  // humanos patrulham
  for(const h of humanos){
    h.x += h.dir*h.vel*dt*T;
    if(h.x<h.ax*T) h.dir=1;
    if(h.x>h.bx*T) h.dir=-1;
    // alcance do jogador (se nao escondido, com cooldown anti-dreno)
    const dx=player.x-h.x, dy=player.y-h.y;
    const d=Math.hypot(dx,dy);
    if(!player.hid && d<T*1.6 && hitCooldown<=0){
      avisos--; AVS.textContent=avisos;
      hitCooldown=1.5;
      showMsg('⚠️ Um humano quase te viu!',1300);
      // empurra o jogador PARA LONGE do humano
      if(d>1){ tryMove(dx/d*18, dy/d*18); }
      if(avisos<=0) gameOver=true;
    }
  }
  tempo+=dt;
}

function draw(){
  // tiles
  for(let cy=0;cy<rows;cy++){
    for(let cx=0;cx<cols;cx++){
      const t=map[cy][cx], tile=tiles[t]||tiles['.'];
      ctx.fillStyle=tile.color;
      ctx.fillRect(cx*T,cy*T,T,T);
      if(t==='1'){
        ctx.font=(T-14)+'px sans-serif'; ctx.textAlign='center';
        ctx.fillText('🌲',cx*T+T/2,cy*T+T/2+10);
      } else if(t==='2'){
        ctx.font=(T-18)+'px sans-serif'; ctx.textAlign='center';
        ctx.fillText('🪨',cx*T+T/2,cy*T+T/2+9);
      } else if(t==='H'){
        ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=3;
        ctx.strokeRect(cx*T+2,cy*T+2,T-4,T-4);
      }
    }
  }
  // casas e lojas: nome no centro + destaque verde se o urso está dentro
  const ptx=Math.floor(player.x/T), pty=Math.floor(player.y/T);
  for(const e of esconderijos){
    const occupied = ptx===e.x && pty===e.y;
    if(occupied){
      ctx.fillStyle='rgba(74,222,128,.45)';
      // realça o interior inteiro do abrigo onde o jogador está
      for(let dy=-2;dy<=2;dy++)for(let dx=-3;dx<=3;dx++){
        const ch2=(map[pty+dy]&&map[pty+dy][ptx+dx])||'.';
        if(ch2==='C'||ch2==='L') ctx.fillRect((ptx+dx)*T,(pty+dy)*T,T,T);
      }
    }
    ctx.font='bold 11px sans-serif'; ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.fillText(e.name, e.x*T+T/2, e.y*T+T/2+4);
  }
  // peixes
  for(let i=0;i<peixes.length;i++){
    if(!peixeState[i]) continue;
    const p=peixes[i];
    ctx.font='20px sans-serif'; ctx.textAlign='center';
    const bob=Math.sin(tempo*3+i)*3;
    ctx.fillText('🐟',p.x*T+T/2, p.y*T+T/2+bob);
  }
  // humanos
  for(const h of humanos){
    ctx.font='28px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🧑',h.x,h.y-4);
    // alcance
    ctx.strokeStyle='rgba(255,80,80,.15)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(h.x,h.y,T*1.6,0,Math.PI*2); ctx.stroke();
  }
  // jogador (urso)
  const bob2=player.moving?Math.sin(tempo*10)*3:0;
  const flip = Math.cos(player.dir)<0;
  ctx.save();
  ctx.translate(player.x, player.y+bob2);
  if(flip) ctx.scale(-1,1);
  ctx.font=player.moving?'30px sans-serif':'28px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('🐻',0,-4);
  // escondido (jornaL)
  if(player.hid){
    ctx.font='16px sans-serif';
    ctx.fillText('🗞️',6,-16);
  }
  ctx.restore();
}

function showMsg(t,dur){
  MSG.style.display='block'; MSG.textContent=t;
  clearTimeout(showMsg._t);
  showMsg._t=setTimeout(()=>{MSG.style.display='none';},dur);
}

let last=performance.now();
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05); last=ts;
  update(dt);
  draw();

  // overlay fim
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#f87171'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center';
    ctx.fillText('O humano te viu! 😱',cv.width/2,cv.height/2-20);
    ctx.fillStyle='#fff'; ctx.font='20px sans-serif';
    ctx.fillText('Pressione R para jogar de novo',cv.width/2,cv.height/2+30);
  } else if(vitoria){
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#4ade80'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🎉 Você escapou!',cv.width/2,cv.height/2-20);
    ctx.fillStyle='#fff'; ctx.font='20px sans-serif';
    ctx.fillText('Todos os peixes coletados! Pressione R para jogar de novo',cv.width/2,cv.height/2+30);
  }
  requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='r') reset();
});

function reset(){
  player={x:18*T+T/2,y:22*T+T/2,vx:0,vy:0,dir:0,moving:false,hid:false};
  peixeColetados=0; avisos=3; peixeState=peixes.map(()=>true);
  hitCooldown=0;
  gameOver=false;vitoria=false; initHumanos();
  PEIXES.textContent='0'; AVS.textContent='3';
}

initHumanos();
requestAnimationFrame(loop);
</script>
</body>
</html>
