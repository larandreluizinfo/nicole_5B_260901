<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Três Ursos na Cidade</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Segoe UI',Arial,sans-serif;
    background:#0b1f3a; color:#fff;
    min-height:100vh; overflow:hidden;
  }
  header {
    text-align:center; padding:10px; background:#12284a; border-bottom:2px solid #2b5a8c;
  }
  header h1 { font-size:1.3rem; }
  header p { font-size:.85rem; opacity:.8; }
  #wrap { position:relative; }
  #canvas { display:block; margin:auto; background:#3a6ea5; touch-action:none; }
  #hud {
    position:fixed; left:10px; top:10px; background:rgba(0,0,0,.55);
    padding:8px 14px; border-radius:10px; font-size:.9rem; z-index:10;
  }
  #msg {
    position:fixed; left:50%; top:20px; transform:translateX(-50%);
    background:rgba(0,0,0,.75); padding:10px 20px; border-radius:12px;
    font-size:1rem; display:none; z-index:20; text-align:center; max-width:90vw;
  }
  #controls {
    position:fixed; right:10px; top:10px; background:rgba(0,0,0,.55);
    padding:8px 14px; border-radius:10px; font-size:.8rem; z-index:10; line-height:1.5;
  }
  kbd { background:#2b5a8c; padding:1px 6px; border-radius:5px; font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>🐻 Os Três Ursos na Cidade</h1>
  <p>Controle o urso andando pela cidade. Pegue peixes, se esconda dos humanos!</p>
</header>
<div id="wrap">
  <canvas id="canvas"></canvas>
</div>
<div id="hud">🐟 Peixes: <b id="peixes">0</b> &nbsp; ⚠️ Avisos: <b id="avs">3</b></div>
<div id="msg"></div>
<div id="controls">
  <b>Movimento:</b><br>
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / Setas<br>
  Correr: <kbd>Shift</kbd><br>
  <small>Móvel: arraste/toque na tela</small>
</div>

<script>
const cv = document.getElementById("canvas");
const ctx = cv.getContext("2d");
const MSG = document.getElementById("msg");
const PEIXES = document.getElementById("peixes");
const AVS = document.getElementById("avs");

const T = 42; // tile size
const cols = 34, rows = 22;
cv.width = cols*T; cv.height = rows*T;

// tile map: 0=chao,1=paredes/quarteiroes,2=agua,3=lagoa,4=estrada
const map = [
"1111111111111111111111111111111111",
"1......22..22....22..............1",
"1..22..22..22..2222..33.......22..1",
"1..22...........22...........22..1",
"1......22....22....22.............1",
"1......22....22....22.....222222..1",
"1...44..........44..........22...1",
"1...44...11..1..44..1..11....22..1",
"1...44..........44...........22..1",
"1...4444....11...44...11........1",
"1....................11........1",
"1...11..11..................1..1",
"1...11..11..................1..1",
"1..............11....11....1.22.1",
"1.....11.......11....11....122221",
"1.....11.....11..11..21.......1.1",
"1.......2222.......22.........1.1",
"1...3333....33..22..21..11...1..1",
"1...3333....33..22....111...1..1",
"1.....33..111...11....11...1...1",
"1......1..111.............1111111",
"1111111111111111111111111111111111"
];

const tiles = {
  '1':{solid:true,color:'#2d5a3a',name:'parede'},   // quarteirão/loja
  '2':{solid:true,color:'#1d3f56',name:'predio'},    // predio
  '3':{solid:false,color:'#46b3e6',name:'agua'},     // lagoa
  '4':{solid:false,color:'#5a6a7a',name:'estrada'},  // estrada
  '0':{solid:false,color:'#97b96b',name:'chao'}      // calçada
};

// pontos de esconderijo (lojas) e peixe
const peixes = [
  {x:6,y:2},{x:8,y:3},{x:14,y:6},{x:18,y:7},{x:24,y:2},
  {x:26,y:10},{x:10,y:11},{x:12,y:13},{x:20,y:15},{x:28,y:18}
];
const esconderijos = [ // lojas (dentro de blocos) - representada como célula
  {x:22,y:8,name:'Loja de Roupas 👗',tipo:'roupa'},
  {x:6,y:13,name:'Peixaria 🐟',tipo:'comida'},
  {x:12,y:9,name:'Casa de Comida 🍞',tipo:'comida'},
  {x:27,y:16,name:'Loja de Roupas 🧥',tipo:'roupa'}
];

let player = { x:2*T+T/2, y:19*T+T/2, vx:0, vy:0, dir:0, moving:false, hid:false };
let peixeColetados = 0;
let avisos = 3;
let peixeState = peixes.map(()=>true);
let humanos = [];
let tempo = 0;
let gameOver = false, vitoria = false;

function isSolid(px,py){
  const cx=Math.floor(px/T), cy=Math.floor(py/T);
  if(cx<0||cy<0||cx>=cols||cy>=rows) return true;
  const t=map[cy][cx];
  return tiles[t]?tiles[t].solid:true;
}
function solidAt(cx,cy){
  if(cx<0||cy<0||cx>=cols||cy>=rows) return true;
  const t=map[cy][cx];
  return tiles[t]?tiles[t].solid:true;
}

// humanos simples (patrulham)
function initHumanos(){
  humanos = [
    {x:16*T,y:9*T,dir:1,ax:13, bx:20, vel:0.7},
    {x:4*T,y:15*T,dir:1,ax:2, bx:10, vel:0.6},
    {x:26*T,y:6*T,dir:1,ax:22, bx:30, vel:0.8},
    {x:12*T,y:18*T,dir:1,ax:8, bx:16, vel:0.7}
  ];
}

const keys={};
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

// controles touch
let touchActive=false,touchX=0,touchY=0;
cv.addEventListener('touchstart',e=>{touchActive=true;const r=cv.getBoundingClientRect();touchX=e.touches[0].clientX-r.left;touchY=e.touches[0].clientY-r.top;e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{const r=cv.getBoundingClientRect();touchX=e.touches[0].clientX-r.left;touchY=e.touches[0].clientY-r.top;e.preventDefault();},{passive:false});
cv.addEventListener('touchend',()=>{touchActive=false;});

function tryMove(dx,dy){
  const nx=player.x+dx, ny=player.y+dy;
  const r=9;
  // verificar cantos para colisão
  if(!isSolid(nx-r,ny-r)&&!isSolid(nx+r,ny-r)&&!isSolid(nx-r,ny+r)&&!isSolid(nx+r,ny+r)){
    player.x=nx; player.y=ny; return true;
  }
  // mover apenas em x
  if(!isSolid(nx-r,player.y-r)&&!isSolid(nx+r,player.y-r)&&!isSolid(nx-r,player.y+r)&&!isSolid(nx+r,player.y+r)){
    player.x=nx;
  }
  if(!isSolid(player.x-r,ny-r)&&!isSolid(player.x+r,ny-r)&&!isSolid(player.x-r,ny+r)&&!isSolid(player.x+r,ny+r)){
    player.y=ny;
  }
  return true;
}

function update(dt){
  if(gameOver||vitoria) return;
  // movimento do jogador
  let ix=0, iy=0;
  if(keys['w']||keys['arrowup']) iy=-1;
  if(keys['s']||keys['arrowdown']) iy=1;
  if(keys['a']||keys['arrowleft']) ix=-1;
  if(keys['d']||keys['arrowright']) ix=1;
  if(touchActive){
    const dx=touchX-player.x, dy=touchY-player.y;
    const d=Math.hypot(dx,dy);
    if(d>12){ ix=dx/d; iy=dy/d; }
  }
  const run = keys['shift']?1.8:1;
  const speed = 110*run*dt;
  player.moving=(ix!==0||iy!==0);
  if(ix||iy){
    player.dir = Math.atan2(iy,ix);
    tryMove(ix*speed, iy*speed);
  }

  // coletar peixes
  for(let i=0;i<peixes.length;i++){
    if(peixeState[i]){
      const p=peixes[i];
      const dx=player.x-(p.x*T+T/2), dy=player.y-(p.y*T+T/2);
      if(Math.hypot(dx,dy)<T*0.7){
        peixeState[i]=false; peixeColetados++;
        PEIXES.textContent=peixeColetados;
        showMsg('🐟 Pegou um peixe!',900);
        if(peixeColetados>=peixes.length) vitoria=true;
      }
    }
  }

  // humanos patrulham
  for(const h of humanos){
    h.x += h.dir*h.vel*dt*T;
    if(h.x<h.ax*T) h.dir=1;
    if(h.x>h.bx*T) h.dir=-1;
    // alcance do jogador (se nao escondido)
    const dx=player.x-h.x, dy=player.y-h.y;
    const d=Math.hypot(dx,dy);
    if(!player.hid && d<T*1.6){
      avisos--; AVS.textContent=avisos;
      showMsg('⚠️ Um humano quase te viu!',1300);
      // empurra o jogador
      const push=14; tryMove(Math.sign(dx)*-push, Math.sign(dy)*-push);
      if(avisos<=0) gameOver=true;
    }
  }
  tempo+=dt;
}

function draw(){
  // tiles
  for(let cy=0;cy<rows;cy++){
    for(let cx=0;cx<cols;cx++){
      const t=map[cy][cx], tile=tiles[t];
      ctx.fillStyle=tile.color;
      ctx.fillRect(cx*T,cy*T,T,T);
      if(t==='1'||t==='2'){
        ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=2;
        ctx.strokeRect(cx*T+2,cy*T+2,T-4,T-4);
      }
    }
  }
  // esconderijos (lojas) - brilham na entrada
  for(const e of esconderijos){
    const cx=e.x, cy=e.y;
    ctx.fillStyle='rgba(255,255,0,.18)';
    ctx.fillRect(cx*T,cy*T,T,T);
    ctx.font='9px sans-serif'; ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.fillText(e.name, cx*T+T/2, cy*T+T/2);
  }
  // peixes
  for(let i=0;i<peixes.length;i++){
    if(!peixeState[i]) continue;
    const p=peixes[i];
    ctx.font='20px sans-serif'; ctx.textAlign='center';
    const bob=Math.sin(tempo*3+i)*3;
    ctx.fillText('🐟',p.x*T+T/2, p.y*T+T/2+bob);
  }
  // humanos
  for(const h of humanos){
    ctx.font='28px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🧑',h.x,h.y-4);
    // alcance
    ctx.strokeStyle='rgba(255,80,80,.15)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(h.x,h.y,T*1.6,0,Math.PI*2); ctx.stroke();
  }
  // jogador (urso)
  const bob2=player.moving?Math.sin(tempo*10)*3:0;
  const flip = Math.cos(player.dir)<0;
  ctx.save();
  ctx.translate(player.x, player.y+bob2);
  if(flip) ctx.scale(-1,1);
  ctx.font=player.moving?'30px sans-serif':'28px sans-serif';
  ctx.textAlign='center';
  ctx.fillText('🐻',0,-4);
  // escondido (jornaL)
  if(player.hid){
    ctx.font='16px sans-serif';
    ctx.fillText('🗞️',6,-16);
  }
  ctx.restore();
}

function showMsg(t,dur){
  MSG.style.display='block'; MSG.textContent=t;
  clearTimeout(showMsg._t);
  showMsg._t=setTimeout(()=>{MSG.style.display='none';},dur);
}

let last=performance.now();
function loop(ts){
  const dt=Math.min((ts-last)/1000,0.05); last=ts;
  update(dt);
  draw();

  // overlay fim
  if(gameOver){
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#f87171'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Os humanos te viram! 😱',cv.width/2,cv.height/2-20);
    ctx.fillStyle='#fff'; ctx.font='20px sans-serif';
    ctx.fillText('Pressione R para jogar de novo',cv.width/2,cv.height/2+30);
  } else if(vitoria){
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#4ade80'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🎉 Você escapou!',cv.width/2,cv.height/2-20);
    ctx.fillStyle='#fff'; ctx.font='20px sans-serif';
    ctx.fillText('Todos os peixes coletados! Pressione R para jogar de novo',cv.width/2,cv.height/2+30);
  }
  requestAnimationFrame(loop);
}

document.addEventListener('keydown',e=>{
  if(e.key.toLowerCase()==='r') reset();
});

function reset(){
  player={x:2*T+T/2,y:19*T+T/2,vx:0,vy:0,dir:0,moving:false,hid:false};
  peixeColetados=0; avisos=3; peixeState=peixes.map(()=>true);
  gameOver=false;vitoria=false; initHumanos();
  PEIXES.textContent='0'; AVS.textContent='3';
}

initHumanos();
requestAnimationFrame(loop);
</script>
</body>
</html>
